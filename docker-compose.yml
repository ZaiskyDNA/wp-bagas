name: bagus

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: ${DB_PASSWORD:-wp_local_pw}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_pw}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wp_local_pw}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_MEMORY_LIMIT', '256M' );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/bagus-child:/var/www/html/wp-content/themes/bagus-child
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./content:/content:ro

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33" # samakan UID dengan www-data di image apache
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wp_local_pw}
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/bagus-child:/var/www/html/wp-content/themes/bagus-child
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./content:/content:ro
      - ./scripts:/scripts:ro

volumes:
  db_data:
  wp_data:
